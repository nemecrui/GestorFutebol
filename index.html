<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b7a3b">
<title>Gestor de Futebol</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#2a3140;
    --green:#0b7a3b; --green2:#16a34a; --accent:#ffcc00; --text:#e6edf3;
    --muted:#8b98a8; --red:#e5484d; --blue:#2f81f7;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;font-size:15px;overscroll-behavior:none}
  #app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
  header{background:linear-gradient(180deg,var(--green),#065f2c);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
    display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.4)}
  header .badge{width:30px;height:30px;border-radius:7px;border:2px solid rgba(255,255,255,.6);flex-shrink:0}
  header h1{font-size:15px;margin:0;flex:1;line-height:1.15}
  header h1 small{display:block;font-weight:400;color:#d5f5e0;font-size:11px}
  header .cash{font-size:12px;font-weight:700;background:rgba(0,0,0,.25);padding:4px 8px;border-radius:20px}
  main{flex:1;padding:12px 12px 84px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
  .card h2{font-size:13px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
  .row{display:flex;align-items:center;gap:8px}
  .between{justify-content:space-between}
  .btn{background:var(--green2);color:#fff;border:none;border-radius:10px;padding:12px 14px;font-size:15px;font-weight:700;cursor:pointer;width:100%}
  .btn:active{transform:scale(.98)}
  .btn.sec{background:var(--panel2);border:1px solid var(--line)}
  .btn.warn{background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .btn.small{padding:7px 10px;font-size:13px;width:auto}
  .pill{font-size:11px;padding:2px 7px;border-radius:20px;font-weight:700}
  .pos-GK{background:#3b2f00;color:var(--accent)}
  .pos-DEF{background:#0e2f4d;color:#7cc0ff}
  .pos-MID{background:#0c3b23;color:#66d9a0}
  .pos-ATT{background:#3d1420;color:#ff8a9b}
  .swatch{width:20px;height:20px;border-radius:5px;flex-shrink:0;border:1px solid rgba(255,255,255,.25);display:inline-block;vertical-align:middle}
  .swatch.sm{width:14px;height:14px;border-radius:4px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 3px;text-align:center;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-size:11px;text-transform:uppercase}
  td.name,th.name{text-align:left}
  tr.me{background:rgba(255,204,0,.08)} tr.me td{font-weight:700}
  .zone-up td:first-child{box-shadow:inset 3px 0 0 var(--green2)}
  .zone-down td:first-child{box-shadow:inset 3px 0 0 var(--red)}
  .plist{display:flex;flex-direction:column;gap:6px}
  .pl{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer}
  .pl .num{width:20px;text-align:center;color:var(--muted);font-weight:700;font-size:13px}
  .pl .info{flex:1;min-width:0}
  .pl .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl .sub{font-size:11px;color:var(--muted)}
  .rating{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
  .r-hi{background:#0c3b23;color:#66d9a0}.r-mid{background:#2a3140;color:#e6edf3}.r-lo{background:#3d1420;color:#ff8a9b}
  nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;background:var(--panel);border-top:1px solid var(--line);
    display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
  nav button{flex:1;background:none;border:none;color:var(--muted);padding:9px 2px 8px;font-size:10px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px}
  nav button.active{color:var(--accent)} nav button .ic{font-size:19px;line-height:1}
  .seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin-bottom:10px;flex-wrap:wrap}
  .seg button{flex:1;background:none;border:none;color:var(--muted);padding:8px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;min-width:44px}
  .seg button.active{background:var(--green2);color:#fff}
  .fx{display:flex;align-items:center;justify-content:space-between;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:6px}
  .fx .t{flex:1;display:flex;align-items:center;gap:6px} .fx .t.a{justify-content:flex-end}
  .fx .t span.full{font-size:13px;line-height:1.15;font-weight:600}
  .fx .sc{font-weight:800;background:var(--bg);padding:4px 10px;border-radius:8px;min-width:56px;text-align:center}
  .muted{color:var(--muted)} .center{text-align:center} .big{font-size:22px;font-weight:800}
  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:20px;
    font-size:13px;z-index:50;opacity:0;transition:.3s;max-width:90%;text-align:center}
  .toast.show{opacity:1}
  .modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:40;padding:20px}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:420px;width:100%;max-height:85vh;overflow:auto;position:relative}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
  .stat .v{font-size:18px;font-weight:800}.stat .l{font-size:11px;color:var(--muted)}
  .barwrap{background:var(--bg);border-radius:6px;height:7px;overflow:hidden;margin-top:3px}
  .bar{height:100%;background:var(--green2)}
  select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:15px}
  .live{min-height:120px}
  .ev{padding:5px 2px;border-bottom:1px solid var(--line);font-size:13px;animation:fade .3s}
  .ev-h{text-align:left}.ev-a{text-align:right}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
  #goalBanner{position:absolute;left:0;right:0;top:36%;text-align:center;font-size:34px;font-weight:900;color:var(--accent);
    text-shadow:0 2px 14px #000,0 0 4px #000;opacity:0;pointer-events:none;z-index:5}
  #goalBanner.show{animation:goalpop .9s ease-out}
  @keyframes goalpop{0%{opacity:0;transform:scale(.4)}20%{opacity:1;transform:scale(1.18)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
  .splash{position:fixed;inset:0;background:linear-gradient(160deg,#065f2c,#0d1117);z-index:60;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:24px;text-align:center;overflow:auto}
  .pitch{position:relative;width:100%;max-width:340px;margin:0 auto;aspect-ratio:68/100;
    background:linear-gradient(180deg,#1a7a3e,#12602f);border-radius:10px;border:2px solid #ffffff33;overflow:hidden}
  .pitch .lines{position:absolute;inset:0}
  .spot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:60px;cursor:pointer}
  .spot .dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;border:2px solid #fff;box-shadow:0 1px 3px #0006}
  .spot .lbl{font-size:10px;margin-top:2px;background:#000a;padding:1px 4px;border-radius:4px;white-space:nowrap;max-width:64px;overflow:hidden;text-overflow:ellipsis}
  .spot .ppos{font-size:8px;color:#ffffffcc;margin-top:1px;font-weight:700}
  .spot.sel .dot{outline:3px solid var(--accent);outline-offset:2px}
  .spot.empty .dot{background:transparent!important;border:2px dashed #ffffff99;color:#ffffffcc;font-size:16px}
  .spot.susp .dot{border-color:var(--red);box-shadow:0 0 0 2px var(--red)}
  .spot .susp-tag{position:absolute;top:-7px;background:var(--red);color:#fff;font-size:8px;padding:0 3px;border-radius:3px;font-weight:800}
  .benchgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .benchpl{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 9px;cursor:pointer}
  .benchpl.sel{outline:2px solid var(--accent);border-color:var(--accent)}
  .benchpl.susp{opacity:.5}
  .benchpl .info{flex:1;min-width:0}
  .benchpl .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
  .benchpl .sub{font-size:11px;color:var(--muted)}
  .benchpl .tag{color:var(--red);font-weight:800}
  .selbar{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--accent);border-radius:10px;padding:8px 10px;margin-bottom:10px;font-size:13px}
  .selbar .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .attrs{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;margin-top:4px}
  .attr{display:flex;align-items:center;gap:6px;font-size:12px}
  .attr .an{flex:1;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .attr .abar{width:46px;height:6px;background:var(--bg);border-radius:4px;overflow:hidden;flex-shrink:0}
  .attr .abar > i{display:block;height:100%}
  .attr .av{width:18px;text-align:right;font-weight:800}
  .close{position:absolute;top:10px;right:12px;background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:8px;width:30px;height:30px;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="badge" id="hBadge"></div>
    <h1 id="hTitle"><span id="hName">Gestor</span> <small id="hSub">—</small></h1>
    <div class="cash" id="hCash">—</div>
  </header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
