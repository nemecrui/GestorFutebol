<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b7a3b">
<title>Gestor de Futebol</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gestor">
<style>
  :root{
    --bg:#0a0e14; --panel:rgba(20,26,36,.74); --panel2:rgba(30,38,52,.72); --line:rgba(120,140,170,.18);
    --green:#0b7a3b; --green2:#22c55e; --accent:#ffcf33; --text:#eaf1f8;
    --muted:#93a2b6; --red:#ef4657; --blue:#3b8cff;
    --pitch:#1f7a43; --pitch2:#176437; --glow:0 0 0 1px rgba(255,255,255,.04), 0 8px 24px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;font-size:15px;overscroll-behavior:none;
    background:
      radial-gradient(1100px 460px at 50% -8%, rgba(34,197,94,.12), transparent 62%),
      radial-gradient(820px 360px at 12% 0%, rgba(59,140,255,.10), transparent 60%),
      radial-gradient(820px 360px at 88% 0%, rgba(255,207,51,.07), transparent 60%),
      radial-gradient(1000px 420px at 50% 112%, rgba(34,197,94,.10), transparent 60%),
      linear-gradient(180deg,#0a0e14,#0c1322 52%,#090d13);
    background-attachment:fixed}
  #app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
  header{padding:calc(10px + env(safe-area-inset-top)) 14px 11px;
    display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;
    background:
      radial-gradient(120% 150% at 18% -50%, rgba(34,197,94,.34), transparent 55%),
      linear-gradient(180deg,#0e2c1c,#0a1a12 68%,rgba(9,13,19,.94));
    border-bottom:1px solid rgba(34,197,94,.30);
    box-shadow:0 6px 22px rgba(0,0,0,.5), inset 0 -1px 0 rgba(255,255,255,.05);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;
    background:linear-gradient(90deg,transparent,var(--green2) 30%,var(--accent) 70%,transparent);opacity:.75}
  header .badge{width:32px;height:32px;border-radius:8px;border:2px solid rgba(255,255,255,.65);flex-shrink:0;position:relative;overflow:hidden;
    box-shadow:0 0 0 1px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.4)}
  header .badge img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:rgba(255,255,255,.9)}
  header h1{font-size:15px;margin:0;flex:1;line-height:1.15}
  header h1 small{display:block;font-weight:400;color:#d5f5e0;font-size:11px}
  header .cash{font-size:12px;font-weight:800;background:linear-gradient(180deg,rgba(255,207,51,.18),rgba(0,0,0,.28));padding:5px 10px;border-radius:20px;border:1px solid rgba(255,207,51,.35);color:#ffe9a8;box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
  main{flex:1;padding:12px 12px 84px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px;
    box-shadow:var(--glow);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);position:relative}
  .card::before{content:"";position:absolute;left:12px;right:12px;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);pointer-events:none}
  .card h2{font-size:12px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;font-weight:800;display:flex;align-items:center;gap:6px}
  .row{display:flex;align-items:center;gap:8px}
  .between{justify-content:space-between}
  .btn{background:linear-gradient(180deg,#2ee06a,#16a34a);color:#04240f;border:none;border-radius:12px;padding:13px 14px;font-size:15px;font-weight:800;cursor:pointer;width:100%;letter-spacing:.2px;
    box-shadow:0 7px 18px rgba(34,197,94,.30), inset 0 1px 0 rgba(255,255,255,.4);transition:transform .08s ease, box-shadow .2s ease, filter .2s}
  .btn:active{transform:translateY(1px) scale(.99);box-shadow:0 3px 10px rgba(34,197,94,.28)}
  .btn.sec{background:linear-gradient(180deg,rgba(42,52,70,.92),rgba(28,36,50,.92));color:var(--text);border:1px solid var(--line);box-shadow:var(--glow)}
  .btn.warn{background:rgba(30,38,52,.6);border:1px solid var(--line);color:var(--muted);box-shadow:none}
  .btn.small{padding:8px 11px;font-size:13px;width:auto}
  .pill{font-size:11px;padding:2px 7px;border-radius:20px;font-weight:700}
  .pos-GK{background:#3b2f00;color:var(--accent)}
  .pos-DEF{background:#0e2f4d;color:#7cc0ff}
  .pos-MID{background:#0c3b23;color:#66d9a0}
  .pos-ATT{background:#3d1420;color:#ff8a9b}
  .swatch{width:20px;height:20px;border-radius:5px;flex-shrink:0;border:1px solid rgba(255,255,255,.25);display:inline-block;vertical-align:middle;position:relative;overflow:hidden}
  .swatch.sm{width:14px;height:14px;border-radius:4px}
  .swatch .crestimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:rgba(255,255,255,.9)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 3px;text-align:center;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-size:11px;text-transform:uppercase}
  td.name,th.name{text-align:left}
  tr.me{background:rgba(255,204,0,.08)} tr.me td{font-weight:700}
  .zone-up td:first-child{box-shadow:inset 3px 0 0 var(--green2)}
  .zone-down td:first-child{box-shadow:inset 3px 0 0 var(--red)}
  .plist{display:flex;flex-direction:column;gap:6px}
  .pl{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;transition:transform .12s ease, border-color .2s, background .2s}
  .pl:active{transform:scale(.99);border-color:rgba(34,197,94,.4)}
  .pl .num{width:34px;text-align:center;color:var(--muted);font-weight:700;font-size:13px}
  .pl .info{flex:1;min-width:0}
  .pl .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl .sub{font-size:11px;color:var(--muted)}
  .rating{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
  .r-hi{background:#0c3b23;color:#66d9a0}.r-mid{background:#2a3140;color:#e6edf3}.r-lo{background:#3d1420;color:#ff8a9b}
  nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;border-top:1px solid var(--line);
    background:linear-gradient(180deg,rgba(14,20,28,.82),rgba(9,13,19,.97));
    display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 -6px 20px rgba(0,0,0,.4)}
  nav button{flex:1;background:none;border:none;color:var(--muted);padding:10px 2px 8px;font-size:10px;cursor:pointer;position:relative;
    display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .2s}
  nav button.active{color:var(--accent)} nav button .ic{font-size:19px;line-height:1;transition:transform .2s, filter .2s}
  nav button.active .ic{transform:translateY(-1px) scale(1.08);filter:drop-shadow(0 0 7px rgba(255,207,51,.55))}
  nav button.active::before{content:"";position:absolute;top:0;width:24px;height:3px;border-radius:0 0 4px 4px;background:var(--accent);box-shadow:0 0 8px var(--accent)}
  nav button:active .ic{transform:scale(.9)}
  .seg{display:flex;background:rgba(16,22,30,.7);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;margin-bottom:10px;flex-wrap:wrap}
  .seg button{flex:1;background:none;border:none;color:var(--muted);padding:8px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;min-width:44px;transition:background .2s, color .2s}
  .seg button.active{background:linear-gradient(180deg,#22c55e,#12a150);color:#04240f;box-shadow:0 2px 8px rgba(34,197,94,.3)}
  .fx{display:flex;align-items:center;justify-content:space-between;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:6px;transition:transform .15s, border-color .2s}
  .fx:active{transform:scale(.995)}
  .fx .t{flex:1;display:flex;align-items:center;gap:6px} .fx .t.a{justify-content:flex-end}
  .fx .t span.full{font-size:13px;line-height:1.15;font-weight:600}
  .fx .sc{font-weight:800;background:#000a;padding:4px 10px;border-radius:8px;min-width:56px;text-align:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
  .muted{color:var(--muted)} .center{text-align:center} .big{font-size:22px;font-weight:800}
  .scorebug{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0;padding:10px;border-radius:12px;
    background:linear-gradient(180deg,#0e2c1c,#0a1a12);border:1px solid rgba(34,197,94,.32);box-shadow:var(--glow)}
  .scorebug .t{flex:1;display:flex;align-items:center;gap:6px}.scorebug .t.a{justify-content:flex-end}
  .scorebug .sc{font-weight:900;font-size:22px;background:#000b;padding:6px 14px;border-radius:10px;min-width:78px;text-align:center;letter-spacing:1px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
  .livemin{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:1px;margin-top:4px}
  #goalFlash{position:absolute;inset:0;opacity:0;pointer-events:none;z-index:4;border-radius:16px}
  #goalFlash.show{animation:gflash .9s ease-out}
  @keyframes gflash{0%{opacity:0}22%{opacity:.8}100%{opacity:0}}
  #goalBanner .gb-sc{font-size:15px;font-weight:800;color:#fff;text-shadow:0 2px 10px #000;margin-top:2px;letter-spacing:.3px}
  #liveTL{position:relative;height:6px;background:#0007;border-radius:4px;margin:8px 0 6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
  #liveTL>i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--green2),var(--accent));border-radius:4px;transition:width .2s linear}
  .tl-dot{position:absolute;top:50%;width:7px;height:7px;border-radius:50%;transform:translate(-50%,-50%);border:1px solid #000a;box-shadow:0 0 5px rgba(0,0,0,.6);z-index:2}
  #liveMom{display:flex;height:7px;border-radius:4px;overflow:hidden;margin-bottom:8px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
  #liveMom>i{height:100%;transition:width .3s ease}
  .livecomment{min-height:18px;font-size:13px;font-style:italic;color:#dbe6f2;text-align:center;margin:0 0 8px;transition:opacity .18s}
  .livestats{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
  .statline{display:flex;align-items:center;justify-content:space-between;font-size:12px;background:rgba(0,0,0,.24);border-radius:7px;padding:3px 10px}
  .statline .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  .statline b{font-variant-numeric:tabular-nums;min-width:34px}
  .statline b:last-child{text-align:right}
  #liveScorers{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:#cfe0d6;margin:-2px 0 8px}
  #liveScorers .sc-col{flex:1;line-height:1.5;min-height:14px}
  #liveScorers .sc-col.a{text-align:right}
  .livesquad{margin-top:8px;background:rgba(0,0,0,.24);border:1px solid var(--line);border-radius:10px;padding:7px 9px}
  .livesquad .sq-h{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:800;margin-bottom:5px}
  .sq-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;padding:3px 2px;border-bottom:1px solid rgba(255,255,255,.05)}
  .sq-row:last-child{border-bottom:none}
  .sq-row .sq-nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .sq-row b{font-variant-numeric:tabular-nums;min-width:30px;text-align:right}
  #main.vin{animation:viewIn .28s cubic-bezier(.22,.61,.36,1)}
  @keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .clink{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px}
  .toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(6px);color:#fff;padding:11px 18px;border-radius:22px;
    background:linear-gradient(180deg,rgba(22,28,38,.97),rgba(12,17,24,.97));border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.5);
    font-size:13px;z-index:50;opacity:0;transition:.28s;max-width:90%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .modal{position:fixed;inset:0;background:rgba(3,6,10,.7);display:flex;align-items:center;justify-content:center;z-index:40;padding:20px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fadeIn .2s ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal .box{background:linear-gradient(180deg,rgba(24,30,42,.98),rgba(14,19,28,.99));border:1px solid var(--line);border-radius:16px;padding:16px;max-width:420px;width:100%;max-height:85vh;overflow:auto;position:relative;box-shadow:0 24px 60px rgba(0,0,0,.6);animation:modalIn .24s cubic-bezier(.22,.61,.36,1)}
  @keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  .live-box{background:
    radial-gradient(130% 72% at 50% -8%, rgba(34,197,94,.20), transparent 60%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 8%, transparent 8% 16%),
    linear-gradient(180deg,#0d2417,#0a1119)!important;border:1px solid rgba(34,197,94,.28)!important}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
  .stat .v{font-size:18px;font-weight:800}.stat .l{font-size:11px;color:var(--muted)}
  .barwrap{background:var(--bg);border-radius:6px;height:7px;overflow:hidden;margin-top:3px}
  .bar{height:100%;background:var(--green2)}
  select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:15px}
  .live{min-height:80px;max-height:150px;overflow:auto}
  .ev{padding:6px 2px;border-bottom:1px solid var(--line);font-size:13px;animation:evIn .35s cubic-bezier(.22,.61,.36,1)}
  .ev-h{text-align:left;border-left:3px solid var(--green2);padding-left:7px;border-radius:2px}
  .ev-a{text-align:right;border-right:3px solid var(--blue);padding-right:7px;border-radius:2px}
  @keyframes evIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
  #goalBanner{position:absolute;left:0;right:0;top:18%;text-align:center;font-size:38px;font-weight:900;color:var(--accent);
    text-shadow:0 3px 20px #000,0 0 24px rgba(255,207,51,.6);opacity:0;pointer-events:none;z-index:5}
  #goalBanner.show{animation:goalpop 1.6s ease-out}
  @keyframes goalpop{0%{opacity:0;transform:scale(.3) rotate(-6deg)}8%{opacity:1;transform:scale(1.25) rotate(2deg)}16%{transform:scale(1) rotate(0)}84%{opacity:1;transform:scale(1.03)}100%{opacity:0;transform:scale(1)}}
  #phaseBanner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#fff;letter-spacing:1.5px;
    text-shadow:0 3px 18px #000;opacity:0;pointer-events:none;z-index:6;background:radial-gradient(circle at 50% 45%,rgba(0,0,0,.5),transparent 62%)}
  #phaseBanner.show{animation:phasepop 1.8s ease-out}
  @keyframes phasepop{0%{opacity:0;transform:scale(.6)}16%{opacity:1;transform:scale(1.12)}32%{transform:scale(1)}74%{opacity:1}100%{opacity:0;transform:scale(1)}}
  .sndbtn{position:absolute;top:8px;right:10px;z-index:7;background:rgba(0,0,0,.4);border:1px solid var(--line);color:#fff;border-radius:8px;width:34px;height:30px;font-size:15px;cursor:pointer;line-height:1}
  .pen-box{text-align:center}
  .pen-row{display:flex;justify-content:center;gap:6px;margin:6px 0;flex-wrap:wrap}
  .pen-mark{width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:6px}
  .pen-mark.pgoal{color:#fff;background:rgba(34,197,94,.28);border-color:var(--green2);animation:pmark .3s ease}
  .pen-mark.pmiss{background:rgba(239,70,87,.22);border-color:var(--red);animation:pmark .3s ease}
  @keyframes pmark{0%{transform:scale(.5)}60%{transform:scale(1.28)}100%{transform:scale(1)}}
  .pen-status{min-height:22px;font-size:15px;font-weight:700;margin:10px 0 12px}
  .splash{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:24px;text-align:center;overflow:auto;
    background:
      radial-gradient(60% 30% at 20% 0%, rgba(255,255,255,.10), transparent 60%),
      radial-gradient(60% 30% at 80% 0%, rgba(255,255,255,.10), transparent 60%),
      radial-gradient(120% 60% at 50% 8%, rgba(34,197,94,.28), transparent 62%),
      linear-gradient(180deg,#0a1a12 0%,#0a1220 46%,#08331d 100%)}
  .splash::after{content:"";position:fixed;left:0;right:0;bottom:0;height:34%;pointer-events:none;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 7%, transparent 7% 14%),
      linear-gradient(180deg, transparent, rgba(20,120,60,.55) 40%, rgba(12,90,45,.85));
    -webkit-mask-image:linear-gradient(180deg,transparent,#000 60%);mask-image:linear-gradient(180deg,transparent,#000 60%);
    transform:perspective(300px) rotateX(46deg);transform-origin:bottom}
  .splash>*{position:relative;z-index:1}
  .pitch{position:relative;width:100%;max-width:340px;margin:0 auto;aspect-ratio:68/100;border-radius:10px;border:2px solid #ffffff40;overflow:hidden;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 9%, rgba(0,0,0,.03) 9% 18%),
      linear-gradient(180deg,#1f8a49,#12602f);
    box-shadow:inset 0 0 60px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.4)}
  .pitch .lines{position:absolute;inset:0}
  .spot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:60px;cursor:pointer}
  .spot .dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;border:2px solid #fff;box-shadow:0 1px 3px #0006}
  .spot .lbl{font-size:10px;margin-top:2px;background:#000a;padding:1px 4px;border-radius:4px;white-space:nowrap;max-width:64px;overflow:hidden;text-overflow:ellipsis}
  .spot .ppos{font-size:8px;color:#ffffffcc;margin-top:1px;font-weight:700}
  .spot.sel .dot{outline:3px solid var(--accent);outline-offset:2px}
  .spot.empty .dot{background:transparent!important;border:2px dashed #ffffff99;color:#ffffffcc;font-size:16px}
  .spot.susp .dot{border-color:var(--red);box-shadow:0 0 0 2px var(--red)}
  .spot .susp-tag{position:absolute;top:-7px;background:var(--red);color:#fff;font-size:8px;padding:0 3px;border-radius:3px;font-weight:800}
  .benchgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .benchpl{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 9px;cursor:pointer}
  .benchpl.sel{outline:2px solid var(--accent);border-color:var(--accent)}
  .benchpl.susp{opacity:.5}
  .benchpl .info{flex:1;min-width:0}
  .benchpl .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
  .benchpl .sub{font-size:11px;color:var(--muted)}
  .benchpl .tag{color:var(--red);font-weight:800}
  .selbar{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--accent);border-radius:10px;padding:8px 10px;margin-bottom:10px;font-size:13px}
  .selbar .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .attrs{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;margin-top:4px}
  .attr{display:flex;align-items:center;gap:6px;font-size:12px}
  .attr .an{flex:1;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .attr .abar{width:46px;height:6px;background:var(--bg);border-radius:4px;overflow:hidden;flex-shrink:0}
  .attr .abar > i{display:block;height:100%}
  .attr .av{width:18px;text-align:right;font-weight:800}
  .close{position:absolute;top:10px;right:12px;background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:8px;width:30px;height:30px;font-size:16px;cursor:pointer}

  /* ===== Animações / dinamismo ===== */
  .bar{transition:width .5s cubic-bezier(.4,0,.2,1)}
  /* cascata de cartões ao trocar de separador */
  @keyframes cardUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  #main.freshtab > .card{animation:cardUp .30s ease both}
  #main.freshtab > .card:nth-child(1){animation-delay:.00s}
  #main.freshtab > .card:nth-child(2){animation-delay:.04s}
  #main.freshtab > .card:nth-child(3){animation-delay:.08s}
  #main.freshtab > .card:nth-child(4){animation-delay:.12s}
  #main.freshtab > .card:nth-child(5){animation-delay:.16s}
  #main.freshtab > .card:nth-child(6){animation-delay:.20s}
  #main.freshtab > .card:nth-child(n+7){animation-delay:.24s}
  /* golo: tremor do ecrã + pulso do placar */
  @keyframes liveShake{0%,100%{transform:translate(0,0)}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,-1px)}80%{transform:translate(3px,1px)}}
  .live-box.shake{animation:liveShake .42s ease}
  /* confetti */
  .confetti-wrap{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:8}
  .confetti{position:absolute;top:32%;width:9px;height:14px;border-radius:2px;opacity:0;will-change:transform,opacity;
    animation:confFall var(--d,1100ms) ease-out forwards}
  @keyframes confFall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x,0),var(--y,260px)) rotate(var(--r,540deg))}}
  /* celebração de ecrã inteiro */
  #celebrate{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%,rgba(11,122,59,.35),rgba(0,0,0,.82));backdrop-filter:blur(2px)}
  #celebrate .cbox{text-align:center;padding:22px;max-width:88%}
  #celebrate .cico{font-size:76px;animation:cbPop .7s cubic-bezier(.2,1.4,.4,1) both}
  #celebrate .ctitle{font-weight:900;font-size:30px;color:#ffcf33;text-shadow:0 3px 18px #000;margin:6px 0 2px;animation:cbPop .7s .06s cubic-bezier(.2,1.4,.4,1) both}
  #celebrate .csub{color:#dbe6f2;font-size:15px;margin-bottom:16px;animation:cbPop .7s .12s ease both}
  @keyframes cbPop{0%{opacity:0;transform:scale(.4) translateY(10px)}100%{opacity:1;transform:none}}
  /* count-up */
  .cash.bump{animation:cashBump .4s ease}
  @keyframes cashBump{0%{transform:scale(1)}45%{transform:scale(1.16)}100%{transform:scale(1)}}
  /* dérbi/rival a pulsar */
  @keyframes softPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  .pulse{animation:softPulse 1.4s ease-in-out infinite}
  body.noanim .bar{transition:none}
  body.noanim #main.freshtab > .card,body.noanim .live-box.shake,body.noanim #celebrate .cico,body.noanim #celebrate .ctitle,body.noanim #celebrate .csub,body.noanim .cash.bump,body.noanim .pulse{animation:none}
  body.noanim .confetti{display:none}
  @media (prefers-reduced-motion: reduce){
    .bar{transition:none}
    #main.freshtab > .card,.live-box.shake,.confetti,#celebrate .cico,#celebrate .ctitle,#celebrate .csub,.cash.bump,.pulse{animation:none!important}
  }
</style>
</head>

  <header>

    <h1 id="hTitle"><span id="hName">Gestor</span> <small id="hSub">—</small></h1>
    <div class="cash" id="hCash">—</div>
  </header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
