<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b7a3b">
<title>Gestor AF Braga — Divisão de Honra</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#2a3140;
    --green:#0b7a3b; --green2:#16a34a; --accent:#ffcc00; --text:#e6edf3;
    --muted:#8b98a8; --red:#e5484d; --blue:#2f81f7;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    font-size:15px; overscroll-behavior:none;
  }
  #app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
       padding-bottom:env(safe-area-inset-bottom)}
  header{
    background:linear-gradient(180deg,var(--green),#065f2c);
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
    display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;
    box-shadow:0 2px 10px rgba(0,0,0,.4)
  }
  header .badge{width:30px;height:30px;border-radius:7px;border:2px solid rgba(255,255,255,.6);flex-shrink:0}
  header h1{font-size:15px;margin:0;flex:1;line-height:1.15}
  header h1 small{display:block;font-weight:400;color:#d5f5e0;font-size:11px}
  header .cash{font-size:12px;font-weight:700;background:rgba(0,0,0,.25);padding:4px 8px;border-radius:20px}
  main{flex:1;padding:12px 12px 84px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
  .card h2{font-size:13px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
  .row{display:flex;align-items:center;gap:8px}
  .between{justify-content:space-between}
  .btn{background:var(--green2);color:#fff;border:none;border-radius:10px;padding:12px 14px;
    font-size:15px;font-weight:700;cursor:pointer;width:100%}
  .btn:active{transform:scale(.98)}
  .btn.sec{background:var(--panel2);border:1px solid var(--line)}
  .btn.warn{background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .btn.small{padding:7px 10px;font-size:13px;width:auto}
  .btn:disabled{opacity:.4}
  .pill{font-size:11px;padding:2px 7px;border-radius:20px;font-weight:700}
  .pos-GR{background:#3b2f00;color:var(--accent)}
  .pos-DEF{background:#0e2f4d;color:#7cc0ff}
  .pos-MED{background:#0c3b23;color:#66d9a0}
  .pos-AVA{background:#3d1420;color:#ff8a9b}
  .swatch{width:20px;height:20px;border-radius:5px;flex-shrink:0;border:1px solid rgba(255,255,255,.25);
    display:inline-block;vertical-align:middle}
  .swatch.sm{width:14px;height:14px;border-radius:4px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 3px;text-align:center;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-size:11px;text-transform:uppercase}
  td.name,th.name{text-align:left}
  tr.me{background:rgba(255,204,0,.08)}
  tr.me td{font-weight:700}
  .zone-up td:first-child{box-shadow:inset 3px 0 0 var(--green2)}
  .zone-down td:first-child{box-shadow:inset 3px 0 0 var(--red)}
  .plist{display:flex;flex-direction:column;gap:6px}
  .pl{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);
    border-radius:10px;padding:8px 10px}
  .pl .num{width:20px;text-align:center;color:var(--muted);font-weight:700;font-size:13px}
  .pl .info{flex:1;min-width:0}
  .pl .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl .sub{font-size:11px;color:var(--muted)}
  .rating{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:14px;flex-shrink:0}
  .r-hi{background:#0c3b23;color:#66d9a0}.r-mid{background:#2a3140;color:#e6edf3}.r-lo{background:#3d1420;color:#ff8a9b}
  nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;background:var(--panel);
    border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
  nav button{flex:1;background:none;border:none;color:var(--muted);padding:9px 2px 8px;font-size:10px;
    cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
  nav button.active{color:var(--accent)}
  nav button .ic{font-size:19px;line-height:1}
  .seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin-bottom:10px;flex-wrap:wrap}
  .seg button{flex:1;background:none;border:none;color:var(--muted);padding:8px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;min-width:44px}
  .seg button.active{background:var(--green2);color:#fff}
  .fx{display:flex;align-items:center;justify-content:space-between;background:var(--panel2);
    border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:6px}
  .fx .t{flex:1;display:flex;align-items:center;gap:6px}
  .fx .t.a{justify-content:flex-end}
  .fx .sc{font-weight:800;background:var(--bg);padding:4px 10px;border-radius:8px;min-width:56px;text-align:center}
  .muted{color:var(--muted)}
  .center{text-align:center}
  .big{font-size:22px;font-weight:800}
  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#000d;color:#fff;
    padding:10px 16px;border-radius:20px;font-size:13px;z-index:50;opacity:0;transition:.3s;max-width:90%;text-align:center}
  .toast.show{opacity:1}
  .modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:40;padding:20px}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:420px;width:100%;max-height:85vh;overflow:auto}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
  .stat .v{font-size:18px;font-weight:800}.stat .l{font-size:11px;color:var(--muted)}
  .barwrap{background:var(--bg);border-radius:6px;height:7px;overflow:hidden;margin-top:3px}
  .bar{height:100%;background:var(--green2)}
  select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);
    border-radius:10px;padding:11px;font-size:15px}
  .live{min-height:120px}
  .ev{padding:5px 2px;border-bottom:1px solid var(--line);font-size:13px;animation:fade .3s}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
  .splash{position:fixed;inset:0;background:linear-gradient(160deg,#065f2c,#0d1117);z-index:60;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;overflow:auto}
  .pitch{position:relative;width:100%;max-width:340px;margin:0 auto;aspect-ratio:68/100;
    background:linear-gradient(180deg,#1a7a3e,#12602f);border-radius:10px;border:2px solid #ffffff33;overflow:hidden}
  .pitch .lines{position:absolute;inset:0}
  .spot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:64px}
  .spot .dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:12px;border:2px solid #fff;box-shadow:0 1px 3px #0006}
  .spot .lbl{font-size:10px;margin-top:2px;background:#000a;padding:1px 4px;border-radius:4px;white-space:nowrap;
    max-width:70px;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="badge" id="hBadge"></div>
    <h1 id="hTitle">Gestor <small id="hSub">—</small></h1>
    <div class="cash" id="hCash">—</div>
  </header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<div class="toast" id="toast"></div>
<script>
"use strict";
/* ============================================================
   GESTOR AF BRAGA — Divisão de Honra (Série A)
   Clubes e cores reais (cores PROVISÓRIAS, a confirmar).
   Jogadores gerados. Motor de simulação próprio.
   ============================================================ */

const POS=["GR","DEF","MED","AVA"];
const FORMATIONS={
  "4-4-2":{DEF:4,MED:4,AVA:2},
  "4-3-3":{DEF:4,MED:3,AVA:3},
  "3-5-2":{DEF:3,MED:5,AVA:2},
  "5-3-2":{DEF:5,MED:3,AVA:2},
  "4-5-1":{DEF:4,MED:5,AVA:1},
};
const MENTAL={
  "Defensivo":{atk:0.85,def:1.15},
  "Equilibrado":{atk:1.0,def:1.0},
  "Atacante":{atk:1.18,def:0.86},
};

// ---- nomes portugueses (fictícios) ----
const FIRST=["João","Rui","Nuno","Tomás","Diogo","Ivo","Marco","Rafael","Bruno","Hugo","Elias","Tiago","Miguel","André","Sérgio","Pedro","Luís","Vasco","Ricardo","Fábio","Dário","Gonçalo","Rúben","Gil","Duarte","Adão","José","Paulo","Hélder","Bernardo","Joel","Ivan","Artur","Cláudio","David","Emanuel","Filipe","Gustavo","Hélio","Jorge","Leandro","Márcio","Nélson","Óscar","Válter"];
const LAST=["Silva","Moreira","Costa","Fernandes","Gonçalves","Oliveira","Rodrigues","Pereira","Machado","Carvalho","Sousa","Martins","Ferreira","Ribeiro","Barbosa","Pinto","Lopes","Cardoso","Antunes","Cunha","Marques","Vieira","Faria","Nogueira","Azevedo","Teixeira","Gomes","Correia","Alves","Matos","Torres","Braga","Peixoto","Sampaio","Rocha","Dias","Cruz","Freitas","Salgado","Vilela","Amorim","Palmeira","Guimarães","Loureiro"];

// ---- Divisão de Honra AF Braga — Série A (liga jogável) ----
// str = nível base do clube (amador). c1/c2 = cores principais (PROVISÓRIAS — a confirmar).
const CLUBS=[
  {n:"AD Ninense",           s:"NIN", str:70, c1:"#1d4ed8", c2:"#ffffff"},
  {n:"Forjães SC",           s:"FOR", str:69, c1:"#c1121f", c2:"#ffffff"},
  {n:"Este FC",              s:"EST", str:66, c1:"#15803d", c2:"#111111"},
  {n:"GD Viatodos",          s:"VIA", str:65, c1:"#c1121f", c2:"#1d4ed8"},
  {n:"FC Roriz",             s:"ROR", str:64, c1:"#111111", c2:"#ffffff"},
  {n:"GDC Martim",           s:"MAR", str:63, c1:"#15803d", c2:"#ffffff"},
  {n:"AD Pousa",             s:"POU", str:63, c1:"#2f9be0", c2:"#ffffff"},
  {n:"SC Ucha",              s:"UCH", str:62, c1:"#7b1e2b", c2:"#ffffff"},
  {n:"GD Alvelos",           s:"ALV", str:61, c1:"#f2c200", c2:"#111111"},
  {n:"Cabreiros SC",         s:"CAB", str:61, c1:"#c1121f", c2:"#111111"},
  {n:"AD Rendufe",           s:"REN", str:60, c1:"#e07a1f", c2:"#ffffff"},
  {n:"S. Paio d'Arcos",      s:"SPA", str:60, c1:"#1d4ed8", c2:"#f2c200"},
  {n:"GD Porto d'Ave",       s:"PDA", str:59, c1:"#e8e8e8", c2:"#1d4ed8"},
  {n:"AD Guilhofrei",        s:"GUI", str:58, c1:"#14274e", c2:"#ffffff"},
  {n:"CD Emilianos",         s:"EMI", str:58, c1:"#6b21a8", c2:"#ffffff"},
  {n:"AC Terras de Bouro",   s:"TBO", str:57, c1:"#15803d", c2:"#f2c200"},
];
// ---- Série B — reserva para subidas/descidas (clubes reais) ----
const RESERVE=[
  {n:"GD Torcatense",        s:"TOR", str:67, c1:"#c1121f", c2:"#111111"},
  {n:"Ribeirão FC",          s:"RIB", str:66, c1:"#1d4ed8", c2:"#ffffff"},
  {n:"Bairro FC",            s:"BAI", str:64, c1:"#111111", c2:"#f2c200"},
  {n:"Operário FC",          s:"OPE", str:63, c1:"#c1121f", c2:"#ffffff"},
  {n:"GD Gandarela",         s:"GAN", str:61, c1:"#15803d", c2:"#ffffff"},
  {n:"UD Taipas",            s:"TAI", str:61, c1:"#f2c200", c2:"#1d4ed8"},
  {n:"GDR Abação",           s:"ABA", str:60, c1:"#1d4ed8", c2:"#c1121f"},
  {n:"GD São Cristóvão",     s:"SCR", str:59, c1:"#7b1e2b", c2:"#f2c200"},
];

let G=null;

// ---------- utilidades ----------
function rnd(a,b){return a+Math.random()*(b-a)}
function ri(a,b){return Math.floor(rnd(a,b+1))}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function money(m){
  if(m>=1) return "€"+(Math.round(m*10)/10)+"M";
  return "€"+Math.round(m*1000)+"K";
}
function textOn(hex){
  const c=hex.replace("#","");const r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
  return (0.299*r+0.587*g+0.114*b)>150?"#111":"#fff";
}
let PID=1;
function makePlayer(pos,base){
  const skill=clamp(Math.round(base+rnd(-8,8)),38,88);
  const age=ri(17,36);
  const potential=clamp(skill+(age<23?ri(2,12):ri(-2,3)),skill,92);
  const value=Math.max(0.03, Math.round(Math.pow(skill/60,3.4)*0.16*(age<30?1:0.6)*100)/100);
  return {id:PID++, name:pick(FIRST)+" "+pick(LAST), pos, skill, age, potential,
    value, form:0, goals:0, apps:0, wage:Math.round(value*0.12*100)/100+0.01};
}
function makeSquad(base){
  const sq=[];
  sq.push(makePlayer("GR",base-2),makePlayer("GR",base-8));
  for(let i=0;i<7;i++)sq.push(makePlayer("DEF",base+(i<5?2:-6)));
  for(let i=0;i<7;i++)sq.push(makePlayer("MED",base+(i<5?1:-6)));
  for(let i=0;i<5;i++)sq.push(makePlayer("AVA",base+(i<3?3:-5)));
  return sq;
}
function clubFromDef(d,id){
  return {id, name:d.n, short:d.s, c1:d.c1, c2:d.c2, strength:d.str,
    budget:Math.round(rnd(0.06,0.28)*100)/100, squad:makeSquad(d.str-6),
    P:0,W:0,D:0,L:0,GF:0,GA:0,Pts:0};
}

// ---------- novo jogo ----------
function newGame(myClubIdx){
  PID=1;
  const clubs=CLUBS.map((d,i)=>clubFromDef(d,i));
  const reserve=RESERVE.map(d=>({name:d.n,short:d.s,strength:d.str,c1:d.c1,c2:d.c2}));
  const me=clubs[myClubIdx];
  G={
    version:3, myId:myClubIdx, week:0, season:1, date:"Set",
    clubs, reserve, fixtures:buildFixtures(clubs.length),
    formation:"4-4-2", mentality:"Equilibrado",
    lineup:autoPickLineup(me,"4-4-2"),
    results:[], news:[], seasonDone:false,
    upSlots:1, downSlots:3
  };
  addNews("Início da época na Divisão de Honra (AF Braga) com o "+me.name+".");
  addNews("Verba de transferências: "+money(me.budget)+".");
  save();
}

function buildFixtures(n){
  const ids=[...Array(n).keys()];
  if(n%2)ids.push(-1);
  const m=ids.length, rounds=[];
  let arr=ids.slice();
  for(let r=0;r<m-1;r++){
    const pairs=[];
    for(let i=0;i<m/2;i++){
      const a=arr[i], b=arr[m-1-i];
      if(a!==-1&&b!==-1) pairs.push(r%2?[b,a]:[a,b]);
    }
    rounds.push(pairs);
    arr.splice(1,0,arr.pop());
  }
  const second=rounds.map(rd=>rd.map(p=>[p[1],p[0]]));
  return rounds.concat(second);
}

// ---------- onze ----------
function bestByPos(squad,pos,n,exclude){
  return squad.filter(p=>p.pos===pos&&!exclude.has(p.id))
    .sort((a,b)=>effSkill(b)-effSkill(a)).slice(0,n).map(p=>p.id);
}
function autoPickLineup(club,formation){
  const f=FORMATIONS[formation], used=new Set(), line=[];
  const gk=bestByPos(club.squad,"GR",1,used); gk.forEach(i=>used.add(i)); line.push(...gk);
  ["DEF","MED","AVA"].forEach(pos=>{
    const ids=bestByPos(club.squad,pos,f[pos],used);
    ids.forEach(i=>used.add(i)); line.push(...ids);
  });
  while(line.length<11){
    const extra=club.squad.find(p=>!used.has(p.id));
    if(!extra)break; used.add(extra.id); line.push(extra.id);
  }
  return line;
}
function effSkill(p){return clamp(p.skill+p.form,30,99)}

// ---------- força ----------
function teamStrength(club,lineup,formation,mentality){
  const players=lineup.map(id=>club.squad.find(p=>p.id===id)).filter(Boolean);
  let def=0,mid=0,atk=0,gk=0,dc=0,mc=0,ac=0;
  players.forEach(p=>{const s=effSkill(p);
    if(p.pos==="GR")gk=s;
    else if(p.pos==="DEF"){def+=s;dc++}
    else if(p.pos==="MED"){mid+=s;mc++}
    else{atk+=s;ac++}
  });
  def=(def+gk*1.4)/((dc||1)+1.4);
  mid=mc?mid/mc:60; atk=ac?atk/ac:60;
  const men=MENTAL[mentality];
  return {def:def*men.def, mid, atk:atk*men.atk, overall:(def+mid+atk)/3};
}

// ---------- motor ----------
function simulate(home,away,hLine,aLine){
  const hS=teamStrength(home,hLine,G.formation,G.mentality);
  const aS=aiStrength(away);
  const hAtt=(hS.atk*0.6+hS.mid*0.4)+3 - aS.def*0.48;
  const aAtt=(aS.atk*0.6+aS.mid*0.4) - hS.def*0.48;
  const hx=clamp((hAtt-24)/9.5,0.35,4.2);
  const ax=clamp((aAtt-26)/9.5,0.3,3.9);
  const events=[]; let hg=0,ag=0;
  for(let m=1;m<=90;m++){
    if(Math.random()<hx/90){hg++; events.push({m,side:"H",club:home,line:hLine})}
    if(Math.random()<ax/90){ag++; events.push({m,side:"A",club:away,line:aLine})}
  }
  return {hg,ag,events};
}
function aiStrength(club){
  const line=autoPickLineup(club,"4-4-2");
  const men=pick(["Defensivo","Equilibrado","Equilibrado","Atacante"]);
  return teamStrength(club,line,"4-4-2",men);
}

// ---------- jornada ----------
function playWeek(){
  if(G.week>=G.fixtures.length)return;
  const round=G.fixtures[G.week], weekRes=[];
  round.forEach(([h,a])=>{
    const home=G.clubs[h], away=G.clubs[a];
    const hLine=(h===G.myId)?G.lineup:autoPickLineup(home,"4-4-2");
    const aLine=(a===G.myId)?G.lineup:autoPickLineup(away,"4-4-2");
    const r=simulate(home,away,hLine,aLine);
    applyResult(home,away,r.hg,r.ag,r.events);
    weekRes.push({h,a,hg:r.hg,ag:r.ag});
  });
  G.results.push(weekRes);
  G.week++;
  advanceMonth();
  if(G.week>=G.fixtures.length)endSeason();
  save();
}
function applyResult(home,away,hg,ag,events){
  home.P++;away.P++;home.GF+=hg;home.GA+=ag;away.GF+=ag;away.GA+=hg;
  if(hg>ag){home.W++;away.L++;home.Pts+=3}
  else if(hg<ag){away.W++;home.L++;away.Pts+=3}
  else{home.D++;away.D++;home.Pts++;away.Pts++}
  events.forEach(e=>{
    const scorers=e.line.map(id=>e.club.squad.find(p=>p.id===id)).filter(p=>p&&p.pos!=="GR");
    const w=scorers.map(p=>(p.pos==="AVA"?3:p.pos==="MED"?1.5:0.5)*effSkill(p));
    const s=weighted(scorers,w); if(s)s.goals++;
  });
}
function weighted(items,w){
  if(!items.length)return null;
  const tot=w.reduce((a,b)=>a+b,0); let r=Math.random()*tot;
  for(let i=0;i<items.length;i++){r-=w[i];if(r<=0)return items[i]}
  return items[items.length-1];
}
const MONTHS=["Set","Out","Nov","Dez","Jan","Fev","Mar","Abr","Mai"];
function advanceMonth(){
  const idx=Math.min(MONTHS.length-1,Math.floor(G.week/(G.fixtures.length/MONTHS.length)));
  G.date=MONTHS[idx];
}

// ---------- fim de época + subida/descida ----------
function endSeason(){
  G.seasonDone=true;
  const table=sortedTable();
  const champ=table[0];
  const meRank=table.findIndex(c=>c.id===G.myId)+1;
  addNews("Fim da época "+G.season+". Campeão: "+champ.name+". Ficaste em "+meRank+"º.");
  const prize=Math.max(0.03,(G.clubs.length-meRank+1)*0.02);
  G.clubs[G.myId].budget=Math.round((G.clubs[G.myId].budget+prize)*100)/100;
}
function newSeason(){
  const table=sortedTable();
  const up=table.slice(0,G.upSlots);
  const down=table.slice(table.length-G.downSlots);
  let meMoved=null;
  if(up.some(c=>c.id===G.myId))meMoved="up";
  else if(down.some(c=>c.id===G.myId))meMoved="down";
  const mineShort=G.clubs[G.myId].short;

  // o teu clube mantém-se sempre nesta liga (continuidade de carreira):
  // nunca "sai" nem vai para a reserva, evitando duplicados
  const leavingClubs=[...up,...down].filter(c=>c.id!==G.myId);
  const leavingIds=new Set(leavingClubs.map(c=>c.id));
  const staying=G.clubs.filter(c=>!leavingIds.has(c.id));
  const nIn=leavingClubs.length;
  const incoming=[];
  for(let i=0;i<nIn;i++){
    const d=G.reserve.shift();
    if(!d)break;
    incoming.push(clubFromDef({n:d.name,s:d.short,str:d.strength,c1:d.c1,c2:d.c2}, 2000+G.season*20+i));
  }
  leavingClubs.forEach(c=>G.reserve.push({name:c.name,short:c.short,strength:c.strength,c1:c.c1,c2:c.c2}));

  let clubs=staying.concat(incoming);
  clubs.forEach((c,i)=>c.id=i);
  const myId=clubs.findIndex(c=>c.short===mineShort);

  clubs.forEach(c=>{c.P=c.W=c.D=c.L=c.GF=c.GA=c.Pts=0;
    c.squad.forEach(p=>{p.goals=0;p.apps=0;
      if(p.age<24&&p.skill<p.potential)p.skill=clamp(p.skill+ri(0,3),38,p.potential);
      else if(p.age>32)p.skill=clamp(p.skill-ri(0,2),38,99);
      p.age++;
    });
  });

  G.clubs=clubs; G.myId=myId; G.season++; G.week=0; G.results=[]; G.seasonDone=false; G.date="Set";
  G.fixtures=buildFixtures(clubs.length);
  G.lineup=autoPickLineup(clubs[myId],G.formation);
  if(meMoved==="up")addNews("Foste campeão e subiste! (continuas jogável nesta liga para a carreira seguir)");
  else if(meMoved==="down")addNews("Desceste de divisão, mas continuas a competir aqui.");
  addNews("Nova época "+G.season+". Entraram: "+incoming.map(c=>c.short).join(", ")+".");
  save();
}

function sortedTable(){
  return G.clubs.slice().sort((a,b)=>
    b.Pts-a.Pts||(b.GF-b.GA)-(a.GF-a.GA)||b.GF-a.GF||a.name.localeCompare(b.name));
}

// ---------- mercado ----------
function buyPlayer(fromClubId,playerId){
  const me=G.clubs[G.myId], from=G.clubs[fromClubId];
  const p=from.squad.find(x=>x.id===playerId); if(!p)return;
  const price=Math.round(p.value*rnd(1.05,1.35)*100)/100;
  if(me.budget<price){toast("Verba insuficiente ("+money(price)+")");return}
  me.budget=Math.round((me.budget-price)*100)/100;
  from.squad=from.squad.filter(x=>x.id!==playerId); me.squad.push(p);
  addNews("Contrataste "+p.name+" ("+p.skill+") por "+money(price)+".");
  toast("Contratado: "+p.name);
  G.lineup=autoPickLineup(me,G.formation); save(); render();
}
function sellPlayer(playerId){
  const me=G.clubs[G.myId];
  if(me.squad.length<=12){toast("Plantel demasiado pequeno");return}
  const p=me.squad.find(x=>x.id===playerId); if(!p)return;
  const price=Math.round(p.value*rnd(0.75,1.05)*100)/100;
  me.budget=Math.round((me.budget+price)*100)/100;
  me.squad=me.squad.filter(x=>x.id!==playerId);
  const other=pick(G.clubs.filter(c=>c.id!==G.myId)); other.squad.push(p);
  addNews("Vendeste "+p.name+" por "+money(price)+".");
  toast("Vendido: "+p.name+" ("+money(price)+")");
  G.lineup=autoPickLineup(me,G.formation); save(); render();
}
function addNews(t){G.news.unshift({t}); if(G.news.length>40)G.news.pop()}

// ---------- persistência ----------

function load(){try{const s=localStorage.getItem("gestorafb");if(s){G=JSON.parse(s);return true}}catch(e){}return false}
function wipe(){localStorage.removeItem("gestorafb");G=null}

function nextFixture(){

  return null;
}

function pitchHTML(me){
  const f=FORMATIONS[G.formation];
  const lines=[["GR",1],["DEF",f.DEF],["MED",f.MED],["AVA",f.AVA]];
  const ys={GR:88,DEF:66,MED:43,AVA:18};
  const players=G.lineup.map(id=>me.squad.find(p=>p.id===id)).filter(Boolean);
  const tc=textOn(me.c1);
  let idx=0, spots="";
  lines.forEach(([pos,n])=>{
    for(let i=0;i<n;i++){
      const p=players[idx++]; if(!p)continue;
      const x= n===1?50 : 8+(84*i/(n-1));
      spots+=`<div class="spot" style="left:${x}%;top:${ys[pos]}%">
        <div class="dot" style="background:${me.c1};color:${tc};border-color:${me.c2}">${effSkill(p)}</div>
        <div class="lbl">${p.name.split(" ").slice(-1)[0]}</div></div>`;
    }
  });
  return `<div class="pitch"><div class="lines">
    <svg width="100%" height="100%" viewBox="0 0 68 100" preserveAspectRatio="none" style="position:absolute;inset:0">
      <g fill="none" stroke="#ffffff55" stroke-width="0.5">
        <rect x="1" y="1" width="66" height="98"/><line x1="1" y1="50" x2="67" y2="50"/>
        <circle cx="34" cy="50" r="8"/><rect x="20" y="1" width="28" height="14"/><rect x="20" y="85" width="28" height="14"/>
      </g></svg></div>${spots}</div>
    <div class="center muted" style="font-size:11px;margin-top:6px">Cada círculo é um titular (número = qualidade). Cores do ${me.name}.</div>`;
}
function bar(l,v){const pct=clamp((v-40)/55*100,3,100);
  return `<div style="margin:7px 0"><div class="row between"><span>${l}</span><b>${Math.round(v)}</b></div>
    <div class="barwrap"><div class="bar" style="width:${pct}%"></div></div></div>`;}

// ---- jogo animado ----
function playMatchAnimated(){
  const next=nextFixture(); if(!next){playWeek();render();return}
  const me=G.clubs[G.myId], opp=G.clubs[next.opp];
  const home=next.home?me:opp, away=next.home?opp:me;
  const hLine=next.home?G.lineup:autoPickLineup(home,"4-4-2");
  const aLine=next.home?autoPickLineup(away,"4-4-2"):G.lineup;
  const r=simulate(home,away,hLine,aLine);
  const mo=document.createElement("div");mo.className="modal";
  mo.innerHTML=`<div class="box"><div class="center"><h2 style="justify-content:center">${home.name} vs ${away.name}</h2></div>
    <div class="fx"><div class="t">${clubTag(home)}</div>
      <div class="sc" id="liveScore">0 - 0</div><div class="t a">${clubTag(away)}</div></div>
    <div class="center muted" id="liveMin">0'</div><div class="live" id="liveEv"></div>
    <button class="btn" id="liveDone" style="display:none">Continuar</button>
    <button class="btn sec small" id="liveSkip" style="width:100%;margin-top:8px">Saltar</button></div>`;
  document.body.appendChild(mo);
  const evBox=mo.querySelector("#liveEv"),scoreEl=mo.querySelector("#liveScore"),minEl=mo.querySelector("#liveMin");
  let hg=0,ag=0,i=0,minute=0,timer;
  const evs=r.events.slice().sort((a,b)=>a.m-b.m);
  function finish(){clearInterval(timer);scoreEl.textContent=r.hg+" - "+r.ag;minEl.textContent="Final";
    playWeek();const done=mo.querySelector("#liveDone");done.style.display="block";
    mo.querySelector("#liveSkip").style.display="none";done.onclick=()=>{mo.remove();render()};}
  mo.querySelector("#liveSkip").onclick=finish;
  timer=setInterval(()=>{minute+=3;if(minute>90)minute=90;minEl.textContent=minute+"'";
    while(i<evs.length&&evs[i].m<=minute){const e=evs[i];if(e.side==="H")hg++;else ag++;
      scoreEl.textContent=hg+" - "+ag;
      const d=document.createElement("div");d.className="ev";
      d.innerHTML=`<b>${e.m}'</b> ⚽ ${(e.side==="H"?home.short:away.short)} — ${pickScorerName(e)}`;
      evBox.prepend(d);i++;}
    if(minute>=90)finish();},220);
}
function pickScorerName(e){
  const c=e.line.map(id=>e.club.squad.find(p=>p.id===id)).filter(p=>p&&p.pos!=="GR");
  const w=c.map(p=>(p.pos==="AVA"?3:p.pos==="MED"?1.5:0.6)*effSkill(p));
  const s=weighted(c,w);return s?s.name:"golo";
}

function bindView(){
  const bp=$("#btnPlay");if(bp)bp.onclick=()=>playMatchAnimated();
  const bs=$("#btnSim");if(bs)bs.onclick=()=>{while(G.week<G.fixtures.length)playWeek();toast("Época simulada");render();};
  const bn=$("#btnNewSeason");if(bn)bn.onclick=()=>{newSeason();TAB="home";render();};
  const br=$("#btnReset");if(br)br.onclick=()=>{if(confirm("Apagar o jogo atual e começar de novo?")){wipe();boot();}};
  const sp=$("#segPos");if(sp)sp.querySelectorAll("button").forEach(b=>b.onclick=()=>{squadFilter=b.dataset.p;render()});
  document.querySelectorAll("[data-sell]").forEach(b=>b.onclick=()=>{if(confirm("Vender este jogador?"))sellPlayer(+b.dataset.sell)});
  const sf=$("#selForm");if(sf)sf.onchange=()=>{G.formation=sf.value;G.lineup=autoPickLineup(G.clubs[G.myId],G.formation);save();render()};
  const sm=$("#selMent");if(sm)sm.onchange=()=>{G.mentality=sm.value;save();render()};
  const ba=$("#btnAuto");if(ba)ba.onclick=()=>{G.lineup=autoPickLineup(G.clubs[G.myId],G.formation);save();toast("Onze otimizado");render()};
  const smk=$("#segMkt");if(smk)smk.querySelectorAll("button").forEach(b=>b.onclick=()=>{marketPos=b.dataset.p;render()});
  document.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>buyPlayer(+b.dataset.from,+b.dataset.buy));
  const sl=$("#segLeague");if(sl)sl.querySelectorAll("button").forEach(b=>b.onclick=()=>{tableTab=b.dataset.t;render()});
}

// ---- ecrã inicial ----
function splashScreen(){
  const el=document.createElement("div");el.className="splash";el.id="splash";
  el.innerHTML=`<div style="width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#16a34a 0 55%,#ffcc00 55% 100%)"></div>
    <h1 style="font-size:24px;margin:14px 0 2px">Gestor AF Braga</h1>
    <div class="muted" style="margin-bottom:20px">Divisão de Honra · Série A</div>
    <div style="width:100%;max-width:360px">
      <div class="muted" style="text-align:left;margin-bottom:6px;font-size:13px">Escolhe o teu clube:</div>
      <select id="clubSel" style="margin-bottom:14px">${CLUBS.map((c,i)=>`<option value="${i}">${c.n}</option>`).join("")}</select>
      <button class="btn" id="startBtn">▶ Começar carreira</button></div>
    <div class="muted" style="font-size:11px;margin-top:16px;max-width:340px">Clubes e nomes reais da AF Braga. Cores provisórias — podem ser corrigidas. Jogadores fictícios.</div>`;
  document.body.appendChild(el);
  el.querySelector("#startBtn").onclick=()=>{newGame(+el.querySelector("#clubSel").value);el.remove();TAB="home";render();};
}
function boot(){
  document.getElementById("splash")?.remove();
  if(load()&&G&&G.version===3){TAB="home";render();}
  else{if(G&&G.version!==3)wipe();splashScreen();}
}

// ---- PWA ----
function initPWA(){
  try{
    const manifest={name:"Gestor AF Braga — Divisão de Honra",short_name:"Gestor AFB",display:"standalone",
      background_color:"#0d1117",theme_color:"#0b7a3b",orientation:"portrait",start_url:".",
      icons:[{src:iconDataURL(192),sizes:"192x192",type:"image/png"},{src:iconDataURL(512),sizes:"512x512",type:"image/png"}]};
    const blob=new Blob([JSON.stringify(manifest)],{type:"application/json"});
    const link=document.createElement("link");link.rel="manifest";link.href=URL.createObjectURL(blob);document.head.appendChild(link);
    const ic=document.createElement("link");ic.rel="apple-touch-icon";ic.href=iconDataURL(192);document.head.appendChild(ic);
    if("serviceWorker" in navigator){
      const sw=`self.addEventListener("install",e=>self.skipWaiting());self.addEventListener("activate",e=>self.clients.claim());self.addEventListener("fetch",e=>{});`;
      navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:"text/javascript"}))).catch(()=>{});
    }
  }catch(e){}
}
function iconDataURL(size){
  const c=document.createElement("canvas");c.width=c.height=size;const x=c.getContext("2d");
  x.fillStyle="#0b7a3b";x.fillRect(0,0,size,size);
  x.fillStyle="#ffcc00";x.beginPath();x.arc(size/2,size/2,size*0.28,0,7);x.fill();
  x.fillStyle="#0b7a3b";x.font="bold "+Math.round(size*0.26)+"px sans-serif";
  x.textAlign="center";x.textBaseline="middle";x.fillText("AFB",size/2,size*0.54);
  return c.toDataURL("image/png");
}
initPWA();
boot();
