<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Post — 4 novos emblemas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#0a1020;display:flex;justify-content:center;align-items:flex-start}
.cv{width:1080px;height:1080px;position:relative;overflow:hidden;
  background:radial-gradient(120% 120% at 50% -10%,#17273f 0%,#0e1830 52%,#0a1020 100%);
  font-family:'Montserrat',Arial,sans-serif;color:#fff;
  display:flex;flex-direction:column;align-items:center}
.pill{margin-top:52px;border:3px solid #f2c200;color:#f2c200;border-radius:44px;
  padding:13px 34px;font-weight:800;letter-spacing:.30em;font-size:29px}
.h1{margin-top:20px;font-family:'Anton',Arial Black,sans-serif;color:#f2c200;
  font-size:104px;line-height:.98;letter-spacing:.01em;text-align:center}
.grid{margin-top:40px;display:flex;flex-wrap:wrap;justify-content:center;gap:34px;width:720px}
.item{width:300px;display:flex;flex-direction:column;align-items:center;gap:14px}
.card{width:300px;height:300px;background:#f6f8fb;border:4px solid #f2c200;border-radius:26px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.card img{max-width:80%;max-height:80%;object-fit:contain}
.name{font-weight:800;font-size:32px;text-align:center}
.cta{margin-top:26px;width:900px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.16);border-radius:22px;padding:22px 24px;text-align:center}
.cta b{display:block;font-size:38px;color:#fff}
.cta small{display:block;margin-top:6px;font-size:25px;color:#a7b6cc;font-weight:600}
.footer{margin-top:auto;width:100%;height:88px;background:#14532d;border-top:4px solid #22c55e;
  display:flex;align-items:center;justify-content:center}
.footer span{color:#34d399;font-weight:800;font-size:46px}
</style>
</head>
<body>
<div class="cv">
  <div class="pill">NOVOS EMBLEMAS</div>
  <div class="h1">+4 CLUBES<br>AGORA NO JOGO</div>
  <div class="grid">
    <div class="item"><div class="card"><img src="../../crests/Soarense_SC.png" alt="Soarense SC"></div><div class="name">Soarense SC</div></div>
    <div class="item"><div class="card"><img src="../../crests/GD_Gemeos.png" alt="GD Gémeos"></div><div class="name">GD Gémeos</div></div>
    <div class="item"><div class="card"><img src="../../crests/FC_Prazins_Corvite.png" alt="FC Prazins Corvite"></div><div class="name">Prazins / Corvite</div></div>
    <div class="item"><div class="card"><img src="../../crests/GDC_Serafão.png" alt="GDC Serafão"></div><div class="name">GDC Serafão</div></div>
  </div>
  <div class="cta">
    <b>Qual é o próximo? Marca o TEU clube 👇</b>
    <small>ou pede-lhes para enviar a autorização do emblema.</small>
  </div>
  <div class="footer"><span>gestorfutebol.pt</span></div>
</div>
</body>
</html>
