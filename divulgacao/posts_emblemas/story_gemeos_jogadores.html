<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Story — GD Gémeos (jogadores)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#0a1020;display:flex;justify-content:center;align-items:flex-start}
.cv{width:1080px;height:1920px;position:relative;overflow:hidden;
  background:radial-gradient(90% 60% at 50% 32%,#1a2c48 0%,#0e1830 55%,#0a1020 100%);
  font-family:'Montserrat',Arial,sans-serif;color:#fff;
  display:flex;flex-direction:column;align-items:center}
.glow{position:absolute;top:600px;left:50%;transform:translate(-50%,-50%);
  width:820px;height:820px;border-radius:50%;filter:blur(90px);opacity:.45;background:#cfd6e2}
.pill{margin-top:120px;border:3px solid #f2c200;color:#f2c200;border-radius:46px;
  padding:16px 38px;font-weight:800;letter-spacing:.22em;font-size:34px;z-index:2}
.new{margin-top:22px;font-size:30px;font-weight:800;letter-spacing:.06em;color:#34d399;z-index:2}
.card{margin-top:60px;width:520px;height:520px;background:#f6f8fb;border:6px solid #f2c200;
  border-radius:44px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 30px 70px rgba(0,0,0,.45);z-index:2}
.card img{max-width:80%;max-height:80%;object-fit:contain}
.name{margin-top:56px;font-family:'Anton',Arial Black,sans-serif;font-size:120px;
  line-height:.94;text-align:center;z-index:2}
.tag{margin-top:16px;font-size:40px;color:#f2c200;font-weight:800;letter-spacing:.02em;z-index:2;text-align:center}
.cta{margin-top:56px;width:860px;background:rgba(242,194,0,.10);
  border:1px solid rgba(242,194,0,.5);border-radius:28px;padding:36px 34px;text-align:center;z-index:2}
.cta b{display:block;font-size:48px;color:#f2c200}
.cta small{display:block;margin-top:12px;font-size:33px;color:#cdd8ea;font-weight:600;line-height:1.3}
.footer{margin-top:auto;width:100%;height:130px;background:#14532d;border-top:5px solid #22c55e;
  display:flex;align-items:center;justify-content:center}
.footer span{color:#34d399;font-weight:800;font-size:62px}
</style>
</head>
<body>
<div class="cv">
  <div class="glow"></div>
  <div class="pill">PLANTEL REAL NO JOGO</div>
  <div class="new">✦ AGORA COM OS JOGADORES VERDADEIROS ✦</div>
  <div class="card"><img src="../../crests/GD_Gemeos.png" alt="GD Gémeos"></div>
  <div class="name">GD<br>GÉMEOS</div>
  <div class="tag">emblema + plantel oficial</div>
  <div class="cta">
    <b>Conheces este plantel? 👇</b>
    <small>Marca o <b>GD Gémeos</b> e os jogadores que reconheces — mostra-lhes que já estão no jogo!</small>
  </div>
  <div class="footer"><span>gestorfutebol.pt</span></div>
</div>
</body>
</html>
