<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Story — GDC Serafão</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#0a1020;display:flex;justify-content:center;align-items:flex-start}
.cv{width:1080px;height:1920px;position:relative;overflow:hidden;
  background:radial-gradient(90% 60% at 50% 34%,#1a2c48 0%,#0e1830 55%,#0a1020 100%);
  font-family:'Montserrat',Arial,sans-serif;color:#fff;
  display:flex;flex-direction:column;align-items:center}
.glow{position:absolute;top:560px;left:50%;transform:translate(-50%,-50%);
  width:820px;height:820px;border-radius:50%;filter:blur(90px);opacity:.5}
.pill{margin-top:150px;border:3px solid #f2c200;color:#f2c200;border-radius:46px;
  padding:16px 40px;font-weight:800;letter-spacing:.30em;font-size:36px;z-index:2}
.card{margin-top:120px;width:560px;height:560px;background:#f6f8fb;border:6px solid #f2c200;
  border-radius:44px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 30px 70px rgba(0,0,0,.45);z-index:2}
.card img{max-width:80%;max-height:80%;object-fit:contain}
.name{margin-top:70px;font-family:'Anton',Arial Black,sans-serif;font-size:120px;
  line-height:.96;text-align:center;z-index:2}
.tag{margin-top:14px;font-size:40px;color:#f2c200;font-weight:800;letter-spacing:.04em;z-index:2}
.cta{margin-top:64px;width:820px;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.18);border-radius:28px;padding:34px;text-align:center;z-index:2}
.cta b{display:block;font-size:46px}
.cta small{display:block;margin-top:10px;font-size:32px;color:#a7b6cc;font-weight:600}
.footer{margin-top:auto;width:100%;height:130px;background:#14532d;border-top:5px solid #22c55e;
  display:flex;align-items:center;justify-content:center}
.footer span{color:#34d399;font-weight:800;font-size:62px}
</style>
</head>
<body>
<div class="cv">
  <div class="glow" style="background:#15803d"></div>
  <div class="pill">AGORA NO JOGO</div>
  <div class="card"><img src="../../crests/GDC_Serafão.png" alt="GDC Serafão"></div>
  <div class="name">GDC<br>SERAFÃO</div>
  <div class="tag">emblema oficial disponível</div>
  <div class="cta">
    <b>Marca o teu clube 👇</b>
    <small>Qual queres ver a seguir com o emblema no jogo?</small>
  </div>
  <div class="footer"><span>gestorfutebol.pt</span></div>
</div>
</body>
</html>
