<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Story — 2 primeiros clubes com jogadores reais</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#0a1020;display:flex;justify-content:center;align-items:flex-start}
.cv{width:1080px;height:1920px;position:relative;overflow:hidden;
  background:radial-gradient(90% 55% at 50% 28%,#1a2c48 0%,#0e1830 55%,#0a1020 100%);
  font-family:'Montserrat',Arial,sans-serif;color:#fff;
  display:flex;flex-direction:column;align-items:center}
.glow{position:absolute;top:520px;left:50%;transform:translate(-50%,-50%);
  width:900px;height:900px;border-radius:50%;filter:blur(100px);opacity:.4;background:#f2c200}
.pill{margin-top:104px;border:3px solid #34d399;color:#34d399;border-radius:46px;
  padding:15px 40px;font-weight:800;letter-spacing:.24em;font-size:33px;z-index:2}
.h1{margin-top:26px;font-family:'Anton',Arial Black,sans-serif;color:#f2c200;
  font-size:132px;line-height:.9;text-align:center;z-index:2;text-shadow:0 6px 24px rgba(0,0,0,.4)}
.sub{margin-top:16px;font-size:40px;color:#eaf1fb;font-weight:800;text-align:center;line-height:1.2;z-index:2}
.sub em{color:#f2c200;font-style:normal}
.crests{margin-top:56px;display:flex;gap:40px;justify-content:center;z-index:2}
.item{display:flex;flex-direction:column;align-items:center;gap:16px}
.card{width:400px;height:400px;background:#f6f8fb;border:6px solid #f2c200;border-radius:38px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 24px 54px rgba(0,0,0,.45)}
.card img{max-width:82%;max-height:82%;object-fit:contain}
.cn{font-weight:800;font-size:34px;text-align:center;color:#fff}
.coach{position:absolute;right:40px;bottom:250px;width:230px;z-index:3;
  filter:drop-shadow(0 14px 24px rgba(0,0,0,.5))}
.cta{margin-top:54px;width:900px;background:rgba(242,194,0,.10);
  border:1px solid rgba(242,194,0,.5);border-radius:28px;padding:36px 34px;text-align:center;z-index:2}
.cta b{display:block;font-size:50px;color:#f2c200}
.cta small{display:block;margin-top:12px;font-size:34px;color:#cdd8ea;font-weight:600;line-height:1.3}
.footer{margin-top:auto;width:100%;height:130px;background:#14532d;border-top:5px solid #22c55e;
  display:flex;align-items:center;justify-content:center}
.footer span{color:#34d399;font-weight:800;font-size:62px}
</style>
</head>
<body>
<div class="cv">
  <div class="glow"></div>
  <div class="pill">ESTREIA NO JOGO</div>
  <div class="h1">JOGADORES<br>REAIS</div>

  <div class="crests">
    <div class="item"><div class="card"><img src="../../crests/FC_Prazins_Corvite.png"></div><div class="cn">FC Prazins/Corvite</div></div>
    <div class="item"><div class="card"><img src="../../crests/GD_Gemeos.png"></div><div class="cn">GD Gémeos</div></div>
  </div>
  <svg class="coach" viewBox="0 0 220 300" xmlns="http://www.w3.org/2000/svg" style="--tie:#f2c200">
    <ellipse cx="110" cy="288" rx="46" ry="8" fill="#000" opacity="0.22"/>

      </g>

      <path d="M110 141 L96 150 L110 176 L124 150 Z" fill="#f2f6fb"/>
      <path d="M110 141 L96 150 L104 168 Z" fill="#1c2836"/>

      <rect x="103" y="120" width="14" height="16" rx="6" fill="#f0c39a"/>
      <circle cx="110" cy="100" r="28" fill="#f0c39a"/>
      <circle cx="84" cy="102" r="5.5" fill="#f0c39a"/>

      <circle cx="100" cy="100" r="3.4" fill="#0b1220" stroke="none"/>

      <path d="M99 111 Q110 121 121 111" fill="none" stroke="#0b1220" stroke-width="3.4"/>
    </g>
  </svg>
  <div class="cta">
    <b>Marca o teu clube 👇</b>

  <div class="footer"><span>gestorfutebol.pt</span></div>
</div>
</body>
</html>
